<!DOCTYPE html>
<html>
  <head>
    <title>Filter Employe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.rtl.min.css" integrity="sha384-gXt9imSW0VcJVHezoNQsP+TNrjYXoGcrqBZJpry9zJt8PCQjobwmhMGaDHTASo9N" crossorigin="anonymous">
  <body>
    <div class="container">
      </div><h1>Filter Employment Details</h1>
      <hr />
      <form action="/filter_emp" method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="name">Employe First/Last Name</label>
          <br />
          <input type="text" id="name" name="name" value="{{ name }}" />
        </div>
        
          <label for="dept">Department</label>
          <br />
          <input type="text" id="dept" name="dept" value="{{ dept }}"/>
        </div>
        <div class="mb-3">
          <label for="role">Role</label>
          <br />
          <input type="text" id="role" name="role" value="{{ role }}"/>
        </div>
        
        <hr />

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
