<!DOCTYPE html>
<html>
  <head>
    <title>Add Employe</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.rtl.min.css"
      integrity="sha384-gXt9imSW0VcJVHezoNQsP+TNrjYXoGcrqBZJpry9zJt8PCQjobwmhMGaDHTASo9N"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
        </div><h1>Add Employment Details</h1>
      <hr />
      <form action="/add_emp" method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="first_name">First Name</label>
          <br />
          <input type="text" id="first_name" name="first_name" value="{{ first_name }}" />
        </div>
        <div class="mb-3">
          <label for="last_name">Last Name</label>
          <br />
          <input type="text" id="last_name" name="last_name" value="{{ last_name }}"/>
        </div>
        <div class="mb-3">
          <label for="salary">Salary</label>
          <br />
          <input type="number" id="salary" name="salary" value="{{ salary }}"/>
        </div>
        <div class="mb-3">
          <label for="dept">Department</label>
          <br />
          <input type="text" id="dept" name="dept" value="{{ dept }}"/>
        </div>
        <div class="mb-3">
          <label for="role">Role</label>
          <br />
          <input type="text" id="role" name="role" value="{{ role }}"/>
        </div>
        <div class="mb-3">
          <label for="role">Phone</label>
          <br />
          <input type="number" id="phone" name="phone" value="{{ phone }}"/>
        </div>
        <div class="mb-3">
          <label for="bonus">Bonus</label>
          <br />
          <input type="number" id="bonus" name="bonus" value="{{ bonus }}"/>
        </div>
        <hr />

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
